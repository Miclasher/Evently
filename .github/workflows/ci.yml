name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Evently.slnx

      - name: Build
        run: dotnet build Evently.slnx --no-restore --configuration Release

      - name: Unit, architecture and auth tests
        run: |
          for project in $(find . -name '*UnitTests.csproj' -o -name '*ArchitectureTests.csproj' -o -name 'Evently.AuthTests.csproj'); do
            dotnet test "$project" --no-build --configuration Release --logger "trx;LogFileName=$(basename "$project").trx"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: "**/TestResults/*.trx"

  integration-tests:
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Integration tests start PostgreSQL, Redis, RabbitMQ and Keycloak via Testcontainers (Docker is preinstalled on ubuntu-latest).
      - name: Integration tests
        run: |
          for project in $(find . -name '*IntegrationTests.csproj'); do
            dotnet test "$project" --configuration Release
          done
